name: Refresh AutoFirma package lock

on:
  push:
    branches:
      - feature/autofirma-signature-position
    paths:
      - package.json
      - .github/workflows/refresh-autofirma-package-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/autofirma-signature-position

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit resolved lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git rm .github/workflows/refresh-autofirma-package-lock.yml
          git commit -m "chore: resolve package lock against main"
          git push origin HEAD:feature/autofirma-signature-position
