name: Update AutoFirma default text

on:
  push:
    branches:
      - feature/autofirma-signature-position
    paths:
      - .github/workflows/update-autofirma-default-text.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/autofirma-signature-position

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Update the AutoFirma standard layer 2 text
        run: |
          python3 <<'PY'
          from pathlib import Path

          old = 'Firmado por $$SUBJECTCN$$ el día $$SIGNDATE=dd/MM/yyyy$$.'
          new = 'Firmado por $$SUBJECTCN$$ el día $$SIGNDATE=dd/MM/yyyy$$ con un certificado emitido por $$ISSUERCN$$'
          files = [
              Path('includes/class-documentate-autofirma.php'),
              Path('assets/js/documentate-autofirma.js'),
              Path('tests/unit/includes/DocumentateAutoFirmaTest.php'),
              Path('tests/unit/admin/DocumentateAdminSettingsTest.php'),
              Path('docs/autofirma.md'),
          ]

          replacements = 0
          for path in files:
              content = path.read_text()
              count = content.count(old)
              if count:
                  path.write_text(content.replace(old, new))
                  replacements += count

          settings_test = Path('tests/unit/admin/DocumentateAdminSettingsTest.php')
          content = settings_test.read_text()
          issuer_assertion = "\t\t$this->assertStringContainsString( '$$ISSUERCN$$', $output );\n"
          date_assertion = "\t\t$this->assertStringContainsString( '$$SIGNDATE=dd/MM/yyyy$$', $output );\n"
          if issuer_assertion not in content:
              content = content.replace(date_assertion, date_assertion + issuer_assertion, 1)
              settings_test.write_text(content)

          if replacements < 4:
              raise SystemExit(f'Expected at least 4 default-text replacements, found {replacements}')
          PY

      - name: Rebuild the browser bundle
        run: |
          npm ci --ignore-scripts
          npm run build:autofirma

      - name: Verify the old default is gone
        run: |
          if grep -R -F 'Firmado por $$SUBJECTCN$$ el día $$SIGNDATE=dd/MM/yyyy$$.' \
            includes/class-documentate-autofirma.php \
            assets/js/documentate-autofirma.js \
            admin/js/documentate-autofirma.js \
            tests/unit/includes/DocumentateAutoFirmaTest.php \
            tests/unit/admin/DocumentateAdminSettingsTest.php \
            docs/autofirma.md; then
            exit 1
          fi

      - name: Commit the correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            includes/class-documentate-autofirma.php \
            assets/js/documentate-autofirma.js \
            admin/js/documentate-autofirma.js \
            admin/js/documentate-autofirma.js.map \
            admin/js/vendor/autoscript.js \
            tests/unit/includes/DocumentateAutoFirmaTest.php \
            tests/unit/admin/DocumentateAdminSettingsTest.php \
            docs/autofirma.md
          git rm .github/workflows/update-autofirma-default-text.yml
          git commit -m "fix: match AutoFirma default signature text"
          git push origin HEAD:feature/autofirma-signature-position
