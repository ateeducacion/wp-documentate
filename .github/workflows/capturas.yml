---
name: Capturas

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.report.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          npm ci
      - name: Check gallery generation
        run: node --test tests/scripts/screenshot-gallery.test.cjs
      - name: Check the gallery branch script
        run: make test-galeria
      - name: Start WordPress
        run: npx wp-env start --config=.wp-env.docker.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture both document workflows
        run: make capturas
      - name: Shrink the screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngquant oxipng
          make optimizar-capturas
      - name: Check for the scene index
        id: report
        if: ${{ !cancelled() && hashFiles('capturas/indice.json') != '' }}
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Keep the report, including failed scenes
        if: ${{ !cancelled() && hashFiles('capturas/indice.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: capturas/
          retention-days: 30

  # Forks can run the script and download the artifact, but cannot publish.
  publish:
    needs: capture
    if: >-
      !cancelled() && needs.capture.outputs.ready == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: capturas
          path: capturas
      - name: Publish screenshots
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh auth setup-git
          SHA=$(scripts/galeria-capturas.sh publish "${PR_NUMBER}" capturas)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Update the PR gallery
        uses: actions/github-script@v9
        env:
          SCREENSHOTS_SHA: ${{ steps.images.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { gallery, MARKER } = require('./scripts/screenshot-gallery.cjs');
            const pr = context.payload.pull_request;
            const shots = JSON.parse(fs.readFileSync('capturas/indice.json', 'utf8'));
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${process.env.SCREENSHOTS_SHA}/pr-${pr.number}/`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = gallery(shots, { base, sha: pr.head.sha, run });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(MARKER));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

  # A closed pull request keeps no gallery: the directory goes, and so does the
  # branch the old per-PR scheme left behind.
  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The base branch, not the pull request: its merge ref may be gone once
      # the PR is closed, and this job writes to the repository, so the script
      # it runs has to be the reviewed one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Drop the gallery of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh auth setup-git
          scripts/galeria-capturas.sh remove "${PR_NUMBER}"
          LEGACY="feature/pr-${PR_NUMBER}-screenshots"
          if git ls-remote --exit-code --heads origin "${LEGACY}" > /dev/null 2>&1; then
            git push -q origin --delete "${LEGACY}"
            echo "Removed the legacy branch ${LEGACY}."
          fi
