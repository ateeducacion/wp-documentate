name: Refresh AutoFirma generated files

on:
  push:
    branches:
      - feature/autofirma-signature-position
    paths:
      - assets/js/documentate-autofirma.js
      - admin/class-documentate-admin-settings.php
      - includes/class-documentate-autofirma.php
      - languages/documentate-es_ES.po

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/autofirma-signature-position

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - run: composer install --prefer-dist
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: composer make-pot
      - run: composer pot-remove-ctime
      - run: composer pot-remove-refs
      - run: composer update-po

      - name: Translate new AutoFirma settings strings
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('languages/documentate-es_ES.po')
          content = path.read_text()
          translations = {
              'AutoFirma visible signature text': 'Texto visible de la firma de AutoFirma',
              'Text shown in the visible PDF signature. The default matches AutoFirma. Supported variables include $$SUBJECTCN$$, $$ISSUERCN$$, $$CERTSERIAL$$ and $$SIGNDATE=dd/MM/yyyy$$. A text parameter in [sign;text=...] overrides this setting for that template.': 'Texto mostrado en la firma visible del PDF. El valor predeterminado coincide con AutoFirma. Las variables compatibles incluyen $$SUBJECTCN$$, $$ISSUERCN$$, $$CERTSERIAL$$ y $$SIGNDATE=dd/MM/yyyy$$. Un parámetro text en [sign;text=...] sobrescribe este ajuste para esa plantilla.',
          }
          for msgid, msgstr in translations.items():
              source = f'msgid "{msgid}"\nmsgstr ""'
              target = f'msgid "{msgid}"\nmsgstr "{msgstr}"'
              if source not in content:
                  raise SystemExit(f'Missing untranslated entry: {msgid}')
              content = content.replace(source, target)
          path.write_text(content)
          PY

      - run: composer untranslated
      - run: composer make-mo

      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            admin/js/documentate-autofirma.js \
            admin/js/documentate-autofirma.js.map \
            admin/js/vendor/autoscript.js \
            includes/vendor/autofirma-intermediate-server \
            languages/documentate.pot \
            languages/documentate-es_ES.po \
            languages/documentate-es_ES.mo
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh AutoFirma generated files"
            git push origin HEAD:feature/autofirma-signature-position
          fi
