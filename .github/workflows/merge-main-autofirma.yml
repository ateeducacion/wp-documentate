name: Merge main into AutoFirma branch

on:
  push:
    branches:
      - feature/autofirma-signature-position
    paths:
      - .github/workflows/merge-main-autofirma.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/autofirma-signature-position
          fetch-depth: 0

      - name: Merge main and resolve npm files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge origin/main --no-ff --no-commit || true
          git checkout --ours package.json package-lock.json
          git add package.json package-lock.json
          UNRESOLVED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNRESOLVED" ]; then
            echo "Unresolved files:"
            echo "$UNRESOLVED"
            exit 1
          fi
          git rm .github/workflows/merge-main-autofirma.yml
          git commit -m "Merge main into feature/autofirma-signature-position"
          git push origin HEAD:feature/autofirma-signature-position
