version: 2
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5

  # 2. Composer (PHP deps del plugin)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5

  # 3. npm (JS/CSS build del plugin)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    # @wordpress/e2e-test-utils-playwright and @wordpress/scripts used to be
    # held below 1.47.0 and 32.3.0 here, because those releases pointed their
    # package "exports" at TypeScript source (./src/index.ts) that the
    # Playwright runner cannot load. Upstream shipped a compiled entry point
    # again in 1.50.0 (exports "." -> ./build/index.js), so the cap no longer
    # applies and both packages track latest again.

  # 4. npm (Cloudflare Worker)
  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
