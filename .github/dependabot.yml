version: 2
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      # One pull request for the weekly actions bump.
      actions:
        patterns:
          - "*"

  # 2. Composer (PHP deps del plugin)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      # PHPCS, PHPUnit and the rest together, including a minor or patch
      # of OpenTBS, FPDF or AutoFirma: they share composer.lock. A major
      # bump stays in its own pull request.
      php-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 3. npm (JS/CSS build del plugin)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    # @wordpress/e2e-test-utils-playwright and @wordpress/scripts used to be
    # held below 1.47.0 and 32.3.0 here, because those releases pointed their
    # package "exports" at TypeScript source (./src/index.ts) that the
    # Playwright runner cannot load. Upstream shipped a compiled entry point
    # again in 1.50.0 (exports "." -> ./build/index.js), so the cap no longer
    # applies and both packages track latest again.
    groups:
      # vite, vitest and @vitest/* share the lockfile: one pull request.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"

  # 4. npm (Cloudflare Worker)
  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      # Separate lockfile from the plugin. Same rule: vitest and @vitest/* together.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
